# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-quy"
BBFILE_PATTERN_meta-quy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-quy = "6"

LAYERDEPENDS_meta-quy = "core"
LAYERSERIES_COMPAT_meta-quy = "scarthgap"
